{% extends "layout.html" %}
{% load i18n %}
{% block title %}
{% trans 'Login' %}
{% endblock %}

{% block content %}

<div class="flex items-center justify-center">
    <div class="max-w-lg mx-auto p-6 bg-base-200 rounded-lg shadow-md">

        <h2 class="text-2xl font-semibold mb-4">{% trans 'Password changed' %}</h2>
        <hr>
        <br>
        <div class="grid grid-cols-1 gap-4 ">

            <div class="flex text-sm text-gray-500 ml-2">
                <div role="alert" class="alert alert-success alert-soft">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 stroke-current" fill="none"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span>{% trans 'Password Changed Successfully' %}</span>
                </div>
            </div>

        </div>
        <br>


        <div> <a href="{% url 'index' %}" class="btn btn-primary w-full">{% trans 'Home' %}</a>
        </div>
    </div>
</div>
</div>





{% endblock %}
