{% extends "layout.html" %}
{% load i18n %}
{% block content %}
<br>
<form method="post"  class="max-w-lg mx-auto p-6 bg-base-200 rounded-lg shadow-md">
  {% csrf_token %}
   <h2 class="text-2xl font-semibold mb-4">{% trans 'Forgot Password' %}</h2>

  <div class="grid grid-cols-1 gap-4">
    <div>
      <label for="password1" class="label">New Password*</label>
      <input type="password" id="password1" name="password1" placeholder="Enter new password" class="input input-bordered w-full" required>
    </div>
    <div>
      <label for="password2" class="label">Confirm New Password*</label>
      <input type="password" id="password2" name="password2" placeholder="Re-enter new password" class="input input-bordered w-full" required>
    </div>
    {% for msg in messages %}<p class="text-error">{{ msg }}</p>{% endfor %}
    <button type="submit" class="btn btn-primary">Reset Password</button>
  </div>
</form>
{% endblock %}
